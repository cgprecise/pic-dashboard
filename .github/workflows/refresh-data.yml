name: Refresh dashboard data

# Runs server-side on GitHub (no browser, so no CORS), pulls the sheet as CSV,
# and commits it as data.csv next to the dashboard. The dashboard reads that
# file from its own origin, so there is never a CORS problem on the client.

on:
  schedule:
    - cron: '*/10 * * * *'   # every ~10 minutes (GitHub may delay under load)
  workflow_dispatch:          # adds a manual "Run workflow" button for instant refresh

# Let the built-in token commit back to the repo. No personal token needed.
permissions:
  contents: write

# Never let two refreshes overlap.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sheet as CSV
        run: |
          # ── To point at a different sheet/tab later, change SHEET_ID / GID here. ──
          SHEET_ID="1_7F6Fc0FV4McHeiSYVCvzaj4JOcD_6TwivfPELDOZKo"
          GID="0"
          URL="https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}"
          # A transient Google export blip should NOT fail the whole run — that just
          # spams a "workflow failed" email for a problem that fixes itself. So: retry
          # hard, and if it still fails, SKIP this cycle (exit 0) leaving data.csv
          # untouched. The next run (~10 min) picks it up, and the daily 7am health
          # check catches a genuine stall (data.csv older than 24h).
          if curl -sL --fail --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 90 "$URL" -o data.csv.tmp; then
            LINES=$(wc -l < data.csv.tmp)
            echo "Fetched $LINES lines"
            if [ "$LINES" -lt 2 ]; then
              echo "::warning::CSV looks empty — skipping this refresh (keeping last good data.csv)"
              rm -f data.csv.tmp; exit 0
            fi
            if ! head -1 data.csv.tmp | grep -q "PO #"; then
              echo "::warning::Unexpected header — skipping this refresh (keeping last good data.csv)"
              rm -f data.csv.tmp; exit 0
            fi
            mv data.csv.tmp data.csv
          else
            echo "::warning::Sheet fetch failed after retries — skipping this refresh (next run will retry)"
            rm -f data.csv.tmp; exit 0
          fi

      - name: Commit if the data changed
        run: |
          git config user.name "pic-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv
          if git diff --staged --quiet; then
            echo "No change in data.csv — nothing to commit."
          else
            git commit -m "chore: refresh dashboard data"
            git push
          fi
